<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Window chrome -->
  <rect width="1280" height="800" fill="#F0F0F1"/>
  <rect width="1280" height="48" fill="#1D2327"/>
  <circle cx="22" cy="24" r="6" fill="#FF5F57"/>
  <circle cx="44" cy="24" r="6" fill="#FEBC2E"/>
  <circle cx="66" cy="24" r="6" fill="#28C840"/>
  <text x="640" y="30" text-anchor="middle" font-size="14" fill="#A7AAAD">Settings ‹ Connectors — WordPress</text>

  <!-- Admin sidebar -->
  <rect x="0" y="48" width="200" height="752" fill="#1D2327"/>
  <g font-size="14" fill="#C3C4C7">
    <text x="24" y="92">Dashboard</text>
    <text x="24" y="128">Posts</text>
    <text x="24" y="164">Media</text>
    <text x="24" y="200">Pages</text>
    <text x="24" y="236">Comments</text>
    <text x="24" y="272">Appearance</text>
    <text x="24" y="308">Plugins</text>
    <text x="24" y="344">Users</text>
    <text x="24" y="380">Tools</text>
  </g>
  <rect x="0" y="394" width="200" height="36" fill="#2271B1"/>
  <text x="24" y="418" font-size="14" fill="#FFFFFF" font-weight="600">Settings</text>
  <g font-size="13" fill="#FFFFFF" opacity="0.85">
    <text x="40" y="446">General</text>
    <text x="40" y="470">Writing</text>
    <text x="40" y="494">Reading</text>
    <text x="40" y="518">Discussion</text>
  </g>
  <text x="40" y="542" font-size="13" font-weight="700" fill="#FFFFFF">Connectors</text>

  <!-- Main content -->
  <g transform="translate(232, 80)">
    <text x="0" y="0" font-size="26" font-weight="400" fill="#1D2327">Connectors</text>
    <text x="0" y="30" font-size="13" fill="#646970">Configure AI providers available to plugins on this site.</text>

    <!-- OpenAI row -->
    <g transform="translate(0, 60)">
      <rect width="1000" height="80" rx="6" fill="#FFFFFF" stroke="#DCDCDE"/>
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#10A37F"/>
      <text x="35" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">A</text>
      <text x="80" y="36" font-size="15" font-weight="600" fill="#1D2327">OpenAI</text>
      <text x="80" y="58" font-size="13" fill="#646970">Not configured — add an API key to connect.</text>
      <rect x="870" y="22" width="100" height="36" rx="4" fill="#F6F7F7" stroke="#2271B1"/>
      <text x="920" y="46" text-anchor="middle" font-size="13" fill="#2271B1" font-weight="500">Configure</text>
    </g>

    <!-- Osaurus row (highlighted) -->
    <g transform="translate(0, 160)">
      <rect width="1000" height="240" rx="6" fill="#FFFFFF" stroke="url(#accent)" stroke-width="2"/>

      <!-- Logo -->
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#0F172A"/>
      <circle cx="40" cy="40" r="13" fill="none" stroke="url(#accent)" stroke-width="3"/>
      <path d="M 36 33 L 42 40 L 36 47" fill="none" stroke="#F8FAFC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="44" y="44" width="6" height="2.4" rx="1" fill="#F8FAFC"/>

      <!-- Title + connected pill -->
      <text x="80" y="36" font-size="15" font-weight="600" fill="#1D2327">Osaurus</text>
      <rect x="160" y="22" width="86" height="22" rx="11" fill="#E6F4EA" stroke="#137333"/>
      <circle cx="175" cy="33" r="3" fill="#137333"/>
      <text x="186" y="38" font-size="11" fill="#137333" font-weight="600">Connected</text>
      <text x="80" y="58" font-size="13" fill="#646970">Local Apple Silicon LLM runtime with OpenAI-compatible endpoints.</text>

      <!-- URL field -->
      <text x="20" y="110" font-size="12" font-weight="600" fill="#1D2327">Server URL</text>
      <rect x="20" y="120" width="700" height="40" rx="4" fill="#FFFFFF" stroke="#8C8F94"/>
      <text x="34" y="146" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1D2327">http://127.0.0.1:1337/v1</text>
      <text x="20" y="180" font-size="12" fill="#646970">Base URL of your local Osaurus server, including the /v1 path.</text>

      <!-- Buttons -->
      <rect x="20" y="195" width="80" height="36" rx="4" fill="#2271B1"/>
      <text x="60" y="219" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">Save</text>
      <rect x="108" y="195" width="80" height="36" rx="4" fill="transparent" stroke="#2271B1"/>
      <text x="148" y="219" text-anchor="middle" font-size="13" fill="#2271B1" font-weight="500">Cancel</text>
    </g>

    <!-- Anthropic row -->
    <g transform="translate(0, 420)">
      <rect width="1000" height="80" rx="6" fill="#FFFFFF" stroke="#DCDCDE"/>
      <rect x="20" y="20" width="40" height="40" rx="8" fill="#D97757"/>
      <text x="40" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">∗</text>
      <text x="80" y="36" font-size="15" font-weight="600" fill="#1D2327">Anthropic</text>
      <text x="80" y="58" font-size="13" fill="#646970">Not configured — add an API key to connect.</text>
      <rect x="870" y="22" width="100" height="36" rx="4" fill="#F6F7F7" stroke="#2271B1"/>
      <text x="920" y="46" text-anchor="middle" font-size="13" fill="#2271B1" font-weight="500">Configure</text>
    </g>
  </g>
</svg>
