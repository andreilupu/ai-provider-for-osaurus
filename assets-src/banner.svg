<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#1F2937" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="1544" y2="100"/>
    <line x1="0" y1="200" x2="1544" y2="200"/>
    <line x1="0" y1="300" x2="1544" y2="300"/>
    <line x1="0" y1="400" x2="1544" y2="400"/>
  </g>

  <!-- Icon block on the left -->
  <g transform="translate(110, 130)">
    <rect width="240" height="240" rx="52" ry="52" fill="#0B1220" stroke="#1F2937" stroke-width="2"/>
    <circle cx="120" cy="120" r="70" fill="none" stroke="url(#accent)" stroke-width="13"/>
    <path d="M 98 95 L 122 120 L 98 145" fill="none" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="130" y="138" width="22" height="9" rx="3" fill="#F8FAFC"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(420, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="0" y="220" font-size="92" font-weight="700" fill="#F8FAFC">Osaurus AI Connector</text>
    <text x="0" y="285" font-size="34" font-weight="400" fill="#94A3B8">Local Apple Silicon LLM, wired into the WordPress AI Client.</text>

    <!-- Feature pills -->
    <g transform="translate(0, 330)" font-size="22" font-weight="500">
      <g transform="translate(0,0)">
        <rect width="220" height="50" rx="25" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="110" y="32" text-anchor="middle" fill="#F8FAFC">Runs locally</text>
      </g>
      <g transform="translate(240,0)">
        <rect width="220" height="50" rx="25" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="110" y="32" text-anchor="middle" fill="#F8FAFC">No API keys</text>
      </g>
      <g transform="translate(480,0)">
        <rect width="260" height="50" rx="25" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="130" y="32" text-anchor="middle" fill="#F8FAFC">OpenAI-compatible</text>
      </g>
    </g>
  </g>
</svg>
